plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.jarvis.revived'
    compileSdk 35

    defaultConfig {
        // Different id from the old app, so both can be installed side by side.
        applicationId "com.jarvis.revived"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O3"
                arguments "-DANDROID_ARM_NEON=ON"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    // All logic lives in :core (plain Java). No AndroidX: the UI uses framework widgets.
    implementation project(':core')
}
