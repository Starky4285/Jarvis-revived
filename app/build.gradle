plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.jarvis.revived'
    // 36 because the SQLCipher / androidx.sqlite libraries are built against it.
    compileSdk 36

    defaultConfig {
        // Different id from the old app, so both can be installed side by side.
        applicationId "com.jarvis.revived"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "0.2.0"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O3"
                arguments "-DANDROID_ARM_NEON=ON"
            }
        }
    }

    // One fixed debug key for every build (Android Studio and GitHub Actions), so a
    // new APK installs OVER the old one and Jarvis' memory survives updates.
    // Debug keys are not secret; never use this key for a Play Store release.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    // All logic lives in :core (plain Java). The UI uses framework widgets.
    implementation project(':core')

    // Encrypted memory vault: SQLCipher (AES-256 for the whole database file).
    // Coordinates as documented by Zetetic: the AAR itself plus androidx.sqlite.
    implementation "net.zetetic:sqlcipher-android:${libs.versions.sqlcipher.get()}@aar"
    implementation libs.androidx.sqlite
}
