name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Core unit tests (memory, commands, routing, answer rules)
        run: ./gradlew :core:test --stacktrace

      - name: Build debug APK (Java + native llama.cpp)
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Privacy check (the APK must not have the INTERNET permission)
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          "$AAPT2" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee permissions.txt
          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "::error::The APK declares android.permission.INTERNET. Jarvis must never be able to connect."
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-revived-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish APK as the "Latest debug build" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk jarvis-revived-debug.apk
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest jarvis-revived-debug.apk \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Latest debug build" \
            --notes "Debug APK built from ${{ github.sha }}. Install on the phone, then Import model (a GGUF such as Qwen2.5-1.5B-Instruct Q4_K_M)."

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/
          retention-days: 7
